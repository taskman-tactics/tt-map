<mgl-map
  [mapStyle]="mapStyle"
  [hash]="true"
  [fitBounds]="fitBounds"
  [fitBoundsOptions]="fitBoundsOptions"
  [maxBounds]="maxBounds"
  [dragRotate]="false"
  [pitchWithRotate]="false"
  [touchPitch]="false"
  [maxPitch]="0"
  [bearing]="0"
  [pitch]="0"
  [renderWorldCopies]="false"
  [attributionControl]="false"
  (mapLoad)="onMapLoad($event)"
  (mapClick)="onMapClick($event)"
>
  <mgl-control mglNavigation [showCompass]="false" />
  <mgl-image-source
    id="basemap"
    [url]="basemapUrl"
    [coordinates]="imageCoordinates"
  />
  <mgl-layer
    id="basemap-layer"
    type="raster"
    source="basemap"
    [paint]="basemapPaint"
  />
  <mgl-geojson-source id="territories" [data]="territoryDisplay().polygons" />
  <mgl-layer
    id="territories-fill"
    type="fill"
    source="territories"
    [paint]="territoryFillPaint"
    (layerClick)="onTerritoryClick($event)"
    (layerMouseEnter)="onTerritoryEnter($event)"
    (layerMouseLeave)="onTerritoryLeave()"
  />
  <mgl-layer
    id="territories-outline"
    type="line"
    source="territories"
    [paint]="territoryLinePaint"
  />
  <mgl-geojson-source id="territory-labels" [data]="territoryDisplay().labels" />
  <mgl-layer
    id="territory-defense-labels"
    type="symbol"
    source="territory-labels"
    [layout]="defenseLabelLayout"
    [paint]="defenseLabelPaint"
  />
  <mgl-layer
    id="territory-name-labels"
    type="symbol"
    source="territory-labels"
    [minzoom]="nameMinZoom"
    [layout]="nameLabelLayout"
    [paint]="nameLabelPaint"
  />
</mgl-map>
<app-scoreboard />
<app-viewer-search (selectIntent)="onSearchIntent($event)" />
<router-outlet />
